
[functions.staff-todo-send-push]
enabled = true
verify_jwt = false
import_map = "./functions/staff-todo-send-push/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/staff-todo-send-push/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/staff-todo-send-push/*.html" ]

[functions.staff-todo-reset-password]
enabled = true
verify_jwt = true
import_map = "./functions/staff-todo-reset-password/deno.json"
entrypoint = "./functions/staff-todo-reset-password/index.ts"

[functions.staff-todo-create-staff]
enabled = true
verify_jwt = true
import_map = "./functions/staff-todo-create-staff/deno.json"
entrypoint = "./functions/staff-todo-create-staff/index.ts"
